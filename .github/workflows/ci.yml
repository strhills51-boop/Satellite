name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./tools/check-map.sh
      - run: cargo fmt --all --check
      - name: cargo clippy (findings surfaced as an annotation)
        run: |
          set -o pipefail
          rustc --version
          if ! cargo clippy --color never --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log; then
            msg=$(grep -E -A6 "^(error|warning)" clippy.log | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=clippy failed::$msg"
            exit 1
          fi
      - run: cargo test --workspace

  licenses:
    name: dependency licenses (ADR 0003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (failures surfaced as an annotation)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then
            msg=$(grep -E "panicked|left:|right:|^error|FAILED|failures:|---- " test.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=windows tests failed::$msg"
            exit 1
          fi
      - run: cargo build --release -p sat-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sat-cli-windows
          path: target/release/sat-cli.exe
