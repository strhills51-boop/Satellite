<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satellite NG</title>
<!-- Part of @sat:devserver: the main screen in the monolith's layout (docs/UI-PARITY.md §1): separator tiles,
     the mod list, the summary stack. It holds no truth: keys and clicks are commands, every change comes back as
     an event, the page re-reads only the rows it shows and repaints only rows whose content changed. -->
<style>
:root {
  /* the owner's UI Laboratory v7 (ADR 0020 §3): blue accent as in the monolith; window names kept */
  --bg: #0c111b; --bg2: #0e1520; --panel: #121b29; --surface2: #172231; --pop: #1a2737; --hover: #223246;
  --line: #283647; --line-soft: #1e2b3c; --fg: #e9f0f8; --muted: #9baabd; --subtle: #72849b;
  --accent: #6caaff; --accent-weak: rgba(108,170,255,.12); --accent-border: rgba(108,170,255,.38); --accent2: #9ac6ff;
  --primary: #3a6fc0; --primary-line: var(--accent-border); --ok: #56d5a0; --signal: #67ffbc;
  --win: rgb(67, 142, 96); --lose: rgb(181, 82, 82); --miss: #3a4757;
  --w-txt: #56d5a0; --l-txt: #f18894; --m-txt: #f6c279; --x-txt: #ae98ff;
  --black: #0b0d10; --red: #f18894; --yellow: #f6c279; --white: #94a3b8; --blue: #6caaff; --green: #56d5a0;
  --shadow: 0 16px 48px rgba(0,0,0,.24); --scroll-thumb: #34485d; --scroll-hot: #657f9b;
  --row: 44px; --ui: Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f0f3f8; --bg2: #f7f9fc; --panel: #ffffff; --surface2: #f6f8fc; --pop: #f0f5fc; --hover: #e8eef7;
  --line: #d6e0eb; --line-soft: #e8edf3; --fg: #202c3e; --muted: #596b7e; --subtle: #78899c;
  --accent: #3479d4; --accent-weak: rgba(52,121,212,.09); --accent-border: rgba(52,121,212,.3); --accent2: #3479d4; --primary: #3479d4;
  --ok: #138e65; --signal: #007f80; --miss: #c3cdd9;
  --w-txt: #138e65; --l-txt: #cf5264; --m-txt: #b47c20; --x-txt: #7853bb; --black: #2b2f36; --white: #9aa3b2;
  --shadow: 0 16px 36px rgba(25,48,76,.10); --scroll-thumb: #adbdcf; --scroll-hot: #748da8; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); display: grid;
  grid-template-rows: auto 1fr; height: 100vh; }
/* lab controls: buttons are unframed areas that light up on hover; fields are quiet wells with an accent ring */
button, input, select { font: inherit; color: var(--fg); }
button { cursor: pointer; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 5px 10px; color: var(--muted); font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; transition: background .16s, color .16s, box-shadow .16s; }
button:hover:not(:disabled) { background: var(--hover); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-soft); }
button:disabled { opacity: .38; cursor: not-allowed; }
button.pri { color: var(--accent); } button.pri:hover:not(:disabled) { background: var(--accent-weak); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-border); }
input, select { background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
input::placeholder { color: var(--subtle); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input:focus-visible, select:focus-visible { outline: none; }
.si { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; flex: none; }
/* scrollbars (lab) */
* { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
::-webkit-scrollbar { width: 7px; height: 7px; } ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 12px; } ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hot); }
/* mode switch (ADR 0020 §1): one container, the active tooth lifted with an accent underline */
.tooth { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: color-mix(in srgb, var(--surface2) 60%, transparent); }
.tooth button { padding: 4px 11px; font-size: 11px; border-radius: 8px; }
.tooth button.on { background: var(--pop); color: var(--fg); box-shadow: 0 1px 7px rgba(0,0,0,.18), inset 0 -2px 0 var(--accent); }
/* the faint "i" of a context (guides, ADR 0020 §2) */
.inf { width: 18px; height: 18px; padding: 0; border-radius: 50%; justify-content: center; font: 10px var(--mono); color: var(--subtle); opacity: .62; }
.inf:hover { opacity: 1; }
header { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--bg2); }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: .065em; font-size: 12px; margin-right: 10px; }
.brand svg { width: 26px; height: 26px; }
.pipeline { display: flex; align-items: center; gap: 2px; }
.pipeline > span { padding: 5px 10px; color: var(--muted); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.pipeline i { color: var(--subtle); font-style: normal; }
/* a status dot per stage: ready — signal, waits — warn */
.pipeline .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px color-mix(in srgb, var(--ok) 40%, transparent); }
#syncBtn.wait::before { background: var(--m-txt); } #syncDot:not(:empty) { font: 11px var(--mono); color: var(--m-txt); }
#sy { position: fixed; top: 28px; bottom: 28px; right: 28px; width: min(760px, calc(100vw - 32px)); z-index: 36; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
#sy[hidden] { display: none; }
#sy .top { padding: 10px 14px 8px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
#sy .t1 { display: flex; gap: 8px; align-items: center; } #sy .t1 b { font-size: 15px; flex: 1; }
#sy .t2 { font-size: 12px; color: var(--muted); }
#syBody { overflow-y: auto; padding: 10px 14px; display: grid; gap: 14px; align-content: start; }
#syBody h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.syr { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
.syr .ic { font-size: 15px; text-align: center; } .syr .what b { font-weight: 600; } .syr .what small { color: var(--muted); }
.syr .st { font: 11px var(--mono); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.syr .st.pending { color: var(--m-txt); border-color: var(--m-txt); } .syr .st.confirmed { color: var(--ok); border-color: var(--ok); }
.syr .ans { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; }
.syr .ans button { font-size: 12px; padding: 2px 10px; } .syr .ans button.on { border-color: var(--ok); color: var(--ok); }
.syp { font: 12px/1.5 var(--mono); display: grid; gap: 2px; }
.syc { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; display: grid; gap: 2px; }
.syc.ok { border-color: var(--ok); } .syc.bad { border-color: var(--l-txt); } .syc small { color: var(--muted); font: 11px var(--mono); word-break: break-all; } .syp .bl { color: var(--l-txt); } .syp .nt { color: var(--muted); }
#sy .foot { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
#passDot:not(:empty) { font: 11px var(--mono); color: var(--muted); }
#passBtn.run #passDot { color: var(--accent); } #passBtn.run::before { background: var(--accent); } #passBtn.bad::before { background: var(--l-txt); }
#passPanel { position: absolute; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  padding: 12px; width: min(420px, calc(100vw - 32px)); font-size: 13px; display: grid; gap: 10px; }
#passPanel[hidden] { display: none; }
.pe { display: grid; gap: 8px; } .pe h4 { margin: 0; display: flex; gap: 8px; align-items: center; } .pe h4 span { flex: 1; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.pe .note { font-size: 12px; color: var(--muted); } .pe .warn { color: var(--l-txt); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.pe table { border-collapse: collapse; width: 100%; font: 12px var(--mono); }
.pe td, .pe th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: middle; }
.pe th { color: var(--muted); font-weight: 400; } .pe tr.sec td { color: var(--accent2); padding-top: 8px; }
.pe tr.set td.k { color: var(--ok); } .pe tr.rm td.k, .pe tr.rm td.v { text-decoration: line-through; color: var(--muted); }
.pe input { width: 100%; padding: 1px 6px; border-radius: 6px; font: 12px var(--mono); }
.pe td.b { white-space: nowrap; width: 1%; } .pe td.b button { font-size: 11px; padding: 0 6px; }
.pe .add { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; }
#passPanel h3 { margin: 0; font-size: 14px; }
#passPanel .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#passPanel .modes button { display: grid; text-align: left; gap: 2px; padding: 8px 10px; }
#passPanel .modes small { color: var(--muted); font-size: 11px; }
#passPanel .bar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; }
#passPanel .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
#passPanel .stages { display: flex; gap: 4px; flex-wrap: wrap; font: 11px var(--mono); color: var(--muted); }
#passPanel .stages span { padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
#passPanel .stages .now { color: var(--fg); border-color: var(--accent); } #passPanel .stages .past { color: var(--ok); }
#passPanel .facts { font: 12px var(--mono); color: var(--muted); display: grid; gap: 2px; } #passPanel .facts b { color: var(--fg); font-weight: 500; }
#passPanel .warn { color: var(--l-txt); }
.sandbox { font: 600 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--subtle); border: 1px solid var(--line); padding: 3px 7px; border-radius: 7px; }
.sandbox.dirty { color: var(--m-txt); border-color: color-mix(in srgb, var(--m-txt) 40%, transparent); } .sandbox.bad { color: var(--l-txt); border-color: color-mix(in srgb, var(--l-txt) 40%, transparent); }
.sandbox.ok { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 30%, transparent); }
#saveBtn.dirty { color: var(--accent); }
/* build indicators (ADR 0020 §5): right edge of the header, hover — the full list */
#stats { margin-left: auto; display: flex; align-items: center; gap: 12px; font: 10px var(--mono); color: var(--muted); }
#stats > span { position: relative; cursor: default; letter-spacing: .04em; }
#stats b { color: var(--fg); font-weight: 650; } #stats .warn b { color: var(--m-txt); } #stats .bad b { color: var(--l-txt); }
#stats .tip { display: none; position: absolute; z-index: 45; right: 0; top: calc(100% + 8px); min-width: 210px; background: var(--pop); border: 1px solid var(--line);
  padding: 10px 12px; border-radius: 9px; box-shadow: var(--shadow); line-height: 1.8; white-space: nowrap; font-size: 11px; letter-spacing: 0; text-transform: none; }
#stats > span:hover .tip { display: block; }
main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; min-height: 0; }
section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
section { border-right-color: var(--line-soft); }
section h2 { margin: 0; padding: 12px 12px 8px; font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); display: flex; gap: 8px; align-items: center; }
section h2 small { color: var(--subtle); font: inherit; letter-spacing: 0; }
#tiles { overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 7px; }
/* separator tiles (lab): raised gradient, small mono head, name at the bottom */
.tile { border: 1px solid var(--line); background: linear-gradient(145deg, var(--pop), var(--surface2)); border-radius: 12px; padding: 9px 11px; min-height: 62px; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; transition: border-color .15s, background .15s; }
.tile:hover, .tile.cur { border-color: var(--accent-border); }
.tile .ctr { font: 10px var(--mono); color: var(--subtle); }
.tile .on { font: 10px var(--mono); color: var(--ok); text-align: right; }
.tile b { grid-column: 1 / 3; align-self: end; font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { display: flex; gap: 8px; padding: 0 10px 8px; align-items: center; }
.tools input { flex: 1; min-width: 0; }
#err { color: var(--l-txt); font-size: 12px; }
#list { flex: 1; overflow-y: auto; overflow-anchor: none; position: relative; outline: none; margin: 0 10px 10px; border: 1px solid var(--line-soft);
  border-radius: 13px; background: var(--panel); }
#list:focus { border-color: var(--accent-border); }
#spacer { width: 1px; }
#layer { position: sticky; top: 0; height: 0; margin: 0 6px; }
.row { position: absolute; left: 0; top: 0; height: var(--row); border: 1px solid var(--line); border-radius: 8px; cursor: default; user-select: none;
  background: var(--panel); overflow: hidden; contain: layout style; }
.row.sel { background: color-mix(in srgb, var(--primary) 26%, transparent); }
/* mod card (owner's layout): toggle top-left, centred name cut on the right, counter group bottom-right */
.card { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: minmax(22px, 1fr) 18px; height: 100%; padding: 2px 10px 2px 8px; }
.toggle { width: 11px; height: 11px; margin: 6px 0 0 2px; border-radius: 50%; background: var(--miss); cursor: pointer; }
.on .toggle { background: var(--ok); }
.name { grid-column: 2; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 2px; }
.off .name { color: var(--muted); }
.line2 { grid-row: 2; grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; min-width: 0; }
.counters { margin-left: auto; display: flex; gap: 10px; font: 11px var(--mono); color: var(--muted); flex: 0 0 auto; }
/* overwrite badges (monolith classic model): per context a pill with its colour dot and one icon per chain */
.strip { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.ctx { display: inline-flex; align-items: center; gap: 3px; height: 17px; padding: 0 4px 0 3px; border-radius: 999px; flex: 0 1 auto; min-width: 0; overflow: hidden;
  border: 1px solid hsl(var(--h) 60% 60% / .30); background: hsl(var(--h) 50% 40% / .12); }
.ctx > b { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: hsl(var(--h) 70% 60%); box-shadow: 0 0 6px hsl(var(--h) 70% 60% / .5); }
.ico { width: 15px; height: 15px; flex: 0 0 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; line-height: 1;
  background: hsl(var(--h) 55% 45% / .34); border: 1px solid hsl(var(--h) 60% 60% / .70); }
.ico.won { box-shadow: 0 0 0 1px var(--win); }
.ctx i { font: 10px var(--mono); font-style: normal; color: var(--muted); padding-left: 1px; }
.owpill { font: 11px var(--mono); padding: 0 6px; border-radius: 999px; border: 1px solid hsl(var(--h) 60% 60% / .35); background: hsl(var(--h) 50% 40% / .14); display: inline-flex; gap: 4px; align-items: center; }
.owpill b { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) 70% 60%); }
.counters .w { color: var(--w-txt); } .counters .l { color: var(--l-txt); } .counters .m { color: var(--m-txt); } .counters .x { color: var(--x-txt); font-weight: 600; }
.prio { color: var(--muted); }
.row.sep { background: var(--surface2); font-weight: 650; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.row.sep .size { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.row.foreign .name { font-style: italic; color: var(--muted); }
/* card style (ADR 0012): the look is inline per card; the watermark is a pseudo-element fed by variables */
.row .selv { position: absolute; inset: 0; background: color-mix(in srgb, var(--primary) 32%, transparent); pointer-events: none; }
.row .wm { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; line-height: 1; }
/* context menu (monolith): title, separator filter, "move to", paint, toggle */
#ctx { position: fixed; z-index: 30; min-width: 260px; max-width: 340px; max-height: 70vh; overflow: auto; background: var(--pop); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.35); padding: 6px; }
#ctx h4 { margin: 4px 8px 6px; font-size: 14px; }
#ctx input { width: 100%; margin-bottom: 4px; }
#ctx .it { padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
#ctx .it:hover { background: color-mix(in srgb, var(--primary) 30%, transparent); }
#ctx hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
#palette { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0,0,0,.45); }
#palette[hidden], #ctx[hidden], .row[hidden] { display: none; }
#palette > div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
#palette h4 { margin: 0 0 10px; }
#palette .sw { display: grid; grid-template-columns: repeat(16, 32px); gap: 8px; }
#palette .sw button { width: 32px; height: 32px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
#palette .sw button:hover { border-color: var(--fg); }
#palette .act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.d1 .card { padding-left: 22px; }
/* keyboard focus: two opposite corners (monolith) */
/* bricks: the monolith's mod container (ADR 0020 §6) — transparent, thin contour, one line */
#list.bricks .row:not(.sep) { background: transparent; border-color: var(--line); overflow: visible; border-radius: 0; }
#list.bricks .row.sel:not(.sep) { background: color-mix(in srgb, var(--primary) 20%, transparent); }
#list.bricks .row.sep { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
/* one cell, three layers (monolith): the name centred in the whole container and cut on both sides; the indicator
   with badges at the left edge and the counters at the right edge stand over it — they cover the name, not squeeze it.
   Their backdrop is the brick's own colour (--bb), so what they cover is hidden cleanly. */
#list.bricks .row:not(.sep) { display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); padding: 0 5px; --side: 6px; --bb: var(--panel); }
#list.bricks .row:not(.sep) > :not(.stk):not(.tg):not(.selv):not(.wm) { grid-area: 1 / 1; }
#list.bricks .row > .lead { align-self: center; justify-self: start; display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; z-index: 1;
  background: var(--bb); box-shadow: 4px 0 4px -1px var(--bb); }
#list.bricks .row.tall > .lead { align-self: start; margin-top: 6px; }
#list.bricks .row > .lead .toggle { margin: 0; width: 10px; height: 10px; flex: none; }
#list.bricks .row:not(.sep) > .name { align-self: center; display: flex; justify-content: center; white-space: nowrap; overflow: hidden; padding: 0; min-width: 0; }
#list.bricks .row > .cnt { align-self: center; justify-self: end; display: flex; gap: 6px; font: 10px var(--mono); color: var(--muted); white-space: nowrap; z-index: 1;
  background: var(--bb); box-shadow: -4px 0 4px -1px var(--bb); max-width: 100%; overflow: hidden; }
#list.bricks .row.tall > .cnt { align-self: end; margin-bottom: 3px; }
/* a brick with its own fill: no backdrop can match it, the layers just stand over the name */
#list.bricks .row.dec { --bb: transparent; }
#list.bricks .row.dec > .lead, #list.bricks .row.dec > .cnt { box-shadow: none; }
/* «Выделение» and «Буфер» blocks */
.block h3 .bsub { margin-left: auto; font: 10px var(--mono); color: var(--subtle); letter-spacing: 0; text-transform: none; }
#bSel .selnames { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 12px; max-height: 96px; overflow: auto; }
#bSel .selnames span { cursor: pointer; } #bSel .selnames span:hover { color: var(--accent); } #bSel .selnames i { color: var(--subtle); font-style: normal; }
#bSel .selsum { display: flex; gap: 8px; font: 11px var(--mono); color: var(--muted); margin-top: 6px; }
#bSel .selsum .w { color: var(--w-txt); } #bSel .selsum .l { color: var(--l-txt); } #bSel .selsum .m { color: var(--m-txt); }
#bSel .selchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#bSel .selchips span { font-size: 11px; padding: 1px 7px; border-radius: 7px; border: 1px solid hsl(var(--h) 55% 60% / .4); background: hsl(var(--h) 50% 45% / .1); }

.chains { border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--primary) 12%, var(--pop)); padding: 6px; margin-bottom: 8px; }
.chn { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 20px; gap: 6px; align-items: center; padding: 3px 6px; margin: 2px 0;
  border-radius: 999px; border: 1px solid hsl(var(--h) 60% 60% / .35); cursor: pointer; }
.chn:hover, .chn.sel { border-color: hsl(var(--h) 70% 65% / .9); background: hsl(var(--h) 50% 40% / .14); }
.chn .ico { width: 16px; height: 16px; flex-basis: 16px; font-size: 10px; }
.chn .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chn .fc { font: 11px var(--mono); color: var(--muted); }
.chn .dn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); background: transparent; padding: 0; font-size: 11px; line-height: 16px; color: var(--muted); }
.chn.done .dn { border-color: var(--ok); color: var(--ok); }
.chn.done .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.chn.paths-open + .paths { display: block; }
.paths { display: none; font: 11px var(--mono); color: var(--muted); white-space: pre; overflow: hidden; text-overflow: ellipsis; padding: 2px 8px 6px 30px; }
.more { color: var(--muted); font-size: 12px; padding: 2px 6px; cursor: pointer; }
.chains:not(.all) .chn.extra { display: none; }
.grp { font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 4px 2px; display: flex; gap: 6px; }
.prt { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; height: 28px; padding: 0 8px;
  cursor: pointer; border-bottom: 1px dashed color-mix(in srgb, #facc15 55%, transparent); overflow: hidden; }
.prt .bg { position: absolute; inset: 0; display: flex; gap: 1px; opacity: .55; pointer-events: none; }
.prt .bg i { flex: 1; } .prt .bg i.w { background: color-mix(in srgb, var(--win) 70%, transparent); } .prt .bg i.l { background: color-mix(in srgb, var(--lose) 60%, transparent); }
.prt .bg i.hl { outline: 1px solid var(--accent2); outline-offset: -1px; }
.prt > :not(.bg) { position: relative; }
.prt .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); } .prt.off .dot { background: var(--miss); }
.prt .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prt .nums { font: 11px var(--mono); } .prt .nums .w { color: var(--w-txt); } .prt .nums .l { color: var(--l-txt); }
.prt .ps { font: 11px var(--mono); color: var(--muted); }
.prt.me { box-shadow: inset 3px 0 #facc15; background: color-mix(in srgb, var(--win) 30%, transparent); }
.prt:hover { filter: brightness(1.15); }
.ico.done { background: color-mix(in srgb, var(--ok) 30%, transparent); border-color: var(--ok); }
.plug { display: grid; grid-template-columns: 56px 1fr; gap: 6px; font-size: 12px; padding: 2px 0; }
.plug .idx { font-family: var(--mono); color: var(--muted); }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
/* decoration editor (monolith "Декорация мода"): sections of compact fields, "mixed" when the selection differs */
.dec-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.dec-top button { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
.pill-recent { width: 26px; height: 22px; padding: 0 !important; border: 1px solid var(--line); }
.dec-sec { border-top: 1px solid var(--line); padding: 6px 0 2px; }
.dec-sec > summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); list-style: none; }
.dec-sec > summary::before { content: "▸ "; } .dec-sec[open] > summary::before { content: "▾ "; }
.dec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; padding: 6px 0 4px; }
.dec-grid label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); min-width: 0; }
.dec-grid label.tg { flex-direction: row; align-items: center; gap: 6px; }
.dec-grid input[type=number], .dec-grid select, .dec-grid input[type=text] { width: 100%; min-width: 0; padding: 3px 6px; font-size: 12px; }
.dec-grid input[type=color] { width: 100%; height: 24px; padding: 0 2px; border-radius: 6px; border: 1px solid var(--line); background: transparent; }
.mixed { color: var(--m-txt); margin-left: 4px; font-size: 10px; }
.emojis { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 2px; }
.emojis button { width: 26px; height: 26px; padding: 0; font-size: 15px; border-radius: 6px; }
.emojis button.cur { outline: 2px solid var(--accent); }
/* record layer (@sat:app.records): chains of plugin records, like file chains */
#rec { position: fixed; inset: 28px; z-index: 36; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }

#recList { overflow: auto; padding: 6px 14px 14px; flex: 1; }
.rc { display: grid; grid-template-columns: 70px 1fr; gap: 2px 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 12px; }

.rc .st b { color: var(--w-txt); font-weight: 600; }

.rc .k-o { color: var(--muted); }
.rc .k-p { color: var(--w-txt); border-color: var(--w-txt); }
.plug .rs { grid-column: 2; font-size: 11px; color: var(--muted); }
.plug .rs a { color: var(--accent); cursor: pointer; }
/* conflict context table (monolith modal with the colour-types flag): rows = mods by separator, columns = paths */
/* file explorer modal (`@sat:app.preview`) */
#fx { position: fixed; inset: 28px; z-index: 36; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }

table.fxtab { width: 100%; border-collapse: collapse; font-size: 12px; } .fxtab th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 6px; cursor: pointer; white-space: nowrap; border-bottom: 1px solid var(--line); user-select: none; }
.fxtab th.on { color: var(--fg, #e5e7eb); } .fxtab td { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; } .fxtab tr.it { cursor: pointer; } .fxtab tr.it:hover td { background: var(--bg2); }

/* the cards mode (monolith, ADR 0020 §9): cards of one width in a flow; facts on top; each participant's row is its
   teeth with the mod's name written inside; a solved card folds to its head */
#ct.m-cards .cx .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 380px)); gap: 10px; align-items: start; }
#ct.m-cards .cx .cards > .br { display: none; }
#ct.m-cards .cc { margin: 0; }
#ct.m-cards .cc .facts { padding: 6px 8px; margin: 2px 0 6px; border-radius: 8px; background: var(--surface2); font-size: 11px; color: var(--muted); display: grid; gap: 2px; }
#ct.m-cards .cc .facts b { color: var(--fg); font-weight: 600; }
#ct.m-cards .cc .facts .fp { font: 10px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ct.m-cards .cc .facts .fp i { font-style: normal; color: var(--subtle); margin-right: 6px; }
#ct.m-cards .cc .mem { position: relative; grid-template-columns: minmax(0, 1fr) auto; height: 22px; margin-bottom: 2px; }
#ct.m-cards .cc .mem canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px; }
#ct.m-cards .cc .mem .nm { position: relative; z-index: 1; padding-left: 6px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.6); }
#ct.m-cards .cc .mem.off .nm { color: #d6dbe3; }
#ct.m-cards .cc .mem .wlmx, #ct.m-cards .cc .mem .wl { position: relative; z-index: 1; padding-right: 6px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85); }
#ct.m-cards .cc.done { opacity: .7; }
.cc .wlmx { font: 11px var(--mono); text-align: right; white-space: nowrap; }
.cc .wlmx .w { color: #86efac; } .cc .wlmx .l { color: #fca5a5; } .cc .wlmx .m { color: #94a3b8; } .cc .wlmx .x { color: #fcd34d; }
.cc .idle { padding: 0 8px 4px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cx .cards { gap: 0; }
.cc { margin-top: 4px; }
.cc.linked { margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
.br { display: flex; gap: 6px; align-items: center; font: 11px var(--mono); color: var(--muted); padding: 1px 8px 1px 18px; border-left: 2px dashed #f59e0b; margin-left: 10px; }
.br.far { border-left-style: dotted; margin-top: 4px; }
.br b { color: #f59e0b; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.br button { font-size: 10px; padding: 0 6px; border-radius: 999px; }
.cc .pick { margin: 0; }
.cc .lay { font-size: 10px; padding: 0 6px; border-radius: 999px; }
.cc .no { font: 10px var(--mono); color: var(--muted); }
.cc .brg { padding: 0 8px 4px; font-size: 11px; color: #f59e0b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc .tag { font: 10px var(--mono); border-radius: 999px; padding: 0 6px; border: 1px solid; white-space: nowrap; }
.cc .tag.chg { color: #f59e0b; border-color: #f59e0b; } .cc .tag.was { color: var(--muted); border-color: var(--line); } .cc .tag.lost { color: var(--l-txt); border-color: var(--lose); }
.cx .common { padding: 2px 10px 4px; font-size: 11px; color: var(--muted); }
.frbar { position: sticky; top: 0; z-index: 2; background: var(--panel); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 10px 6px; font-size: 12px; color: var(--muted); }
.frbar .prog { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; }
.frbar .bar { flex: 1; height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; max-width: 220px; }
.frbar .bar i { display: block; height: 100%; background: var(--win); }
.frbar button.on { background: #f59e0b; color: #111; border-color: #f59e0b; }
.frbar .solved { color: var(--w-txt); font-weight: 600; }
.cc.skipped { opacity: .55; }
.orph { font-size: 12px; color: #f59e0b; display: flex; gap: 6px; align-items: center; padding: 4px 8px; }
.ccbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel); border: 1px solid #f59e0b; border-radius: 8px; font-size: 12px; }
.ccbar span { flex: 1; }
.cc.front { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b inset; }
.cc .fr { font: 10px var(--mono); color: #f59e0b; border: 1px solid #f59e0b; border-radius: 999px; padding: 0 6px; }
#ctAdv { position: absolute; right: 18px; top: 140px; bottom: 18px; width: min(860px, 92%); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 10px 12px; z-index: 6; font-size: 12px; }
#ctAdv .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
#ctAdv .h b { flex: 1; font-size: 14px; }
#ctAdv table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
#ctAdv td, #ctAdv th { padding: 2px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
#ctAdv td.n, #ctAdv th.n { text-align: left; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
#ctAdv tr.sep td { color: var(--muted); text-align: left; background: var(--bg2); }
#ctAdv tr.mv td.to { color: #f59e0b; font-weight: 600; }
#ctAdv .warn { color: #f59e0b; }
#ctAdv .note { color: var(--muted); margin: 6px 0; }
.tree { font: 12px/1.6 var(--mono); max-height: 60vh; overflow: auto; }
.tmodes { display: flex; gap: 4px; margin: 2px 0 6px; }
.tmodes button { font-size: 11px; padding: 1px 8px; border-radius: 999px; }
.tmodes button.on { background: var(--acc, #3b82f6); color: #fff; border-color: transparent; }
.tmeta { font-size: 12px; color: var(--muted); margin: 0 2px 4px; }
.tmeta .w, .tree .w { color: var(--w-txt); } .tmeta .l, .tree .l { color: var(--l-txt); } .tmeta .o, .tree .o { color: rgb(66,128,153); }
.tfocus { font-size: 12px; margin: 0 2px 4px; color: #f59e0b; }
.tfocus button { font-size: 10px; padding: 0 6px; }
.tree .te .tw { width: 12px; color: var(--muted); } .tree .te .ic { width: 18px; text-align: center; }
.tree .te.con { border-left-color: #f59e0b; } .tree .te.mg .nm, .tree .te.ag .nm { color: var(--muted); }
.tree .te .wn { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.tree .te.fl { cursor: pointer; } .tree .te.pick { background: rgba(245,158,11,.12); }
.tree .te.dimf { opacity: .45; } .tree .te.lit { background: rgba(245,158,11,.10); }
.tc { display: inline-grid; place-items: center; min-width: 18px; height: 16px; border-radius: 4px; font-size: 11px; background: hsl(var(--h) 45% 30% / .5); border: 1px solid hsl(var(--h) 60% 50%); cursor: pointer; }
.tow { margin: 0 0 4px calc(var(--d) * 14px + 30px); padding: 4px 8px; border-left: 2px solid #f59e0b; font-size: 12px; background: var(--bg2); border-radius: 0 6px 6px 0; }
.tow a { cursor: pointer; } .tow a.w { color: var(--w-txt); } .tow a.l { color: var(--l-txt); }
#bConf .chn.tfoc { outline: 1px solid #f59e0b; }
.tree .te { display: flex; gap: 6px; cursor: default; padding-left: calc(var(--d) * 14px); border-left: 3px solid transparent; }
.tree .te.dir { cursor: pointer; }
.tree .te.lose { border-left-color: var(--lose); } .tree .te.win { border-left-color: var(--win); } .tree .te.own { border-left-color: rgb(66,128,153); }
.tree .te .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .te .c { color: var(--muted); } .tree .te .w { color: var(--w-txt); } .tree .te .l { color: var(--l-txt); }
.cc details { font-size: 12px; color: var(--muted); margin-top: 4px; }
.cc .tree.ctr { max-height: 40vh; color: var(--fg); }
.cc pre { margin: 4px 0 0; font: 11px/1.45 var(--mono); color: var(--fg); max-height: 260px; overflow: auto; white-space: pre; }
#ctScroll { flex: 1; overflow: auto; position: relative; overscroll-behavior: contain; }
#ctView { position: sticky; top: 0; left: 0; }
#ctCanvas { display: block; }
#ctStatus { padding: 6px 14px; border-top: 1px solid var(--line); font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
#ctStatus b { color: var(--fg); font-weight: 500; }
.ctbtn { font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-left: auto; }
@media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr) 340px; } #tilesec { display: none; } }

/* SATELLITE / HELIO — visual refinement of the owner's v7 language.
   Pure presentation layer. No JS-facing ids, selectors, virtual layout, or data semantics changed.
   Hard-coded geometric values here are local UI affordances, NOT order/layout positions. */
:root {
  --bg: #0b111b;
  --bg2: #0d1520;
  --panel: #121c2a;
  --surface2: #172232;
  --pop: #1b2a3c;
  --hover: #22354a;
  --line: #2c3a4d;
  --line-soft: #1f2d3d;
  --fg: #e9f1f9;
  --muted: #9daec1;
  --subtle: #72869e;
  --accent: #79b2ff;
  --accent2: #b7d6ff;
  --accent-border: rgba(121,178,255,.36);
  --accent-weak: rgba(121,178,255,.085);
  --ok: #53d6a4;
  --signal: #67ffbc;
  --scroll-thumb: #30465e;
  --scroll-hot: #627d9a;
  --ui: 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif;
  --shadow: 0 24px 65px rgba(0,0,0,.42);
}
:root[data-theme="light"] {
  --bg: #edf2f8;
  --bg2: #f8fafe;
  --panel: #fff;
  --surface2: #f3f7fc;
  --pop: #eaf1f9;
  --hover: #e5edf7;
  --line: #ccd9e7;
  --line-soft: #e2e9f1;
  --fg: #202e42;
  --muted: #52667d;
  --subtle: #7d90a6;
  --accent: #2874ce;
  --accent2: #1f69c7;
  --accent-border: rgba(40,116,206,.32);
  --accent-weak: rgba(40,116,206,.075);
  --ok: #18926d;
  --signal: #00a77f;
  --scroll-thumb: #b0c3d7;
  --scroll-hot: #7794ad;
  --shadow: 0 18px 60px rgba(22,56,96,.15);
}
html { background:var(--bg); }
body {
  background:
    radial-gradient(ellipse 78% 45% at 58% -18%, rgba(49,107,178,.075), transparent 80%),
    var(--bg);
  font-size: 12.5px;
  line-height: 1.37;
  letter-spacing: .006em;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  isolation: isolate;
}
:root[data-theme="light"] body {
  background: radial-gradient(ellipse 72% 45% at 60% -8%, rgba(96,145,208,.09), transparent 75%), var(--bg);
}
/* Physical star-field: deliberately imperceptible when content is dense. */
#sat-ui-dust { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
#sat-ui-dust i { position:absolute; display:block; border-radius:50%; width:var(--r); height:var(--r);
  background: rgba(182,213,247,.8); opacity:var(--o); box-shadow:0 0 3px rgba(136,180,222,.16);
  animation: sat-dust-drift var(--t) ease-in-out infinite alternate;
}
:root[data-theme="light"] #sat-ui-dust i { background:#47769e; opacity:calc(var(--o) * .52); box-shadow:none; }
@keyframes sat-dust-drift { 0% { transform:translate3d(0,0,0) } 100% { transform:translate3d(var(--dx),var(--dy),0) } }
@media(prefers-reduced-motion:reduce) { #sat-ui-dust i { animation:none; } }
body > header, body > main { position:relative; z-index:1; }
body > header {
  flex-wrap: nowrap;
  min-height: 55px;
  padding: 0 16px;
  gap: 10px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg2) 95%, var(--pop)), var(--bg2));
  border-bottom: 1px solid color-mix(in srgb,var(--line) 72%,transparent);
  box-shadow: 0 3px 16px rgba(3,8,14,.09);
}
.brand { gap:9px; margin-right:16px; color:var(--fg); font-size:12px; font-weight:780; letter-spacing:.11em; white-space:nowrap; }
.brand svg { width:28px; height:28px; filter: drop-shadow(0 0 9px rgba(103,255,188,.085)); }
.pipeline { padding-right:13px; margin-right:1px; border-right:1px solid var(--line-soft); white-space:nowrap; gap:0; }
.pipeline .st, .pipeline > span { font-size:11.5px; color:var(--muted); padding:6px 8px; font-weight:580; }
.pipeline .st::before { width:5px; height:5px; opacity:.88; }
.pipeline > i { color:var(--subtle); opacity:.56; padding:0 2px; font-size:12px; }
body > header #recBtn, body > header #fxBtn { font-size:11.5px; padding-inline:9px; }
body > header #fxPinBtn { width:21px; padding:0; justify-content:center; font-size:10px; }
body > header .si { width:14px; height:14px; stroke-width:1.65; }
body > header #stats { gap:3px; }
#stats > span { font-size:9.5px; letter-spacing:.09em; display:inline-flex; align-items:center; gap:5px; padding:5px 7px; border-radius:6px; }
#stats > span:hover { background:var(--hover); }
#stats > span b { font-size:10px; }
#stats .tip { min-width:225px; border-radius:11px; padding:11px 13px; line-height:1.7; letter-spacing:0; box-shadow:var(--shadow); }
.sandbox { border-radius:6px; font-size:9px; letter-spacing:.12em; }
body > header #theme { width:29px; height:29px; padding:5px; margin-left:1px; display:grid; place-items:center; }
body > header #saveBtn { font-size:11px; }
button { border-radius:7px; font-weight:560; transition:background .14s,color .14s, box-shadow .14s; }
button:hover:not(:disabled) { background:color-mix(in srgb,var(--hover) 88%, transparent); box-shadow:none; }
button.pri { color:var(--accent); }
button.pri:hover:not(:disabled) { background:var(--accent-weak); box-shadow:inset 0 0 0 1px var(--accent-border); }
:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
input, select { background:var(--surface2); border-color:var(--line-soft); border-radius:8px; }
input:hover, select:hover { border-color:var(--line); }
input[type="checkbox"],input[type="radio"] { accent-color:var(--accent); }
main { grid-template-columns:188px minmax(0,1fr) 318px; background:transparent; min-height:0; }
main > section { min-width:0; border-right:1px solid color-mix(in srgb,var(--line) 68%,transparent); }
main > section:nth-child(2) { background:rgba(9,17,29,.12); }
:root[data-theme="light"] main > section:nth-child(2) { background:rgba(193,209,231,.09); }
section h2 { flex:none; padding:15px 14px 11px; color:var(--subtle); font:650 9px/1 var(--mono); letter-spacing:.13em; }
section h2 small { font-size:9px; font-weight:450; opacity:.77; }
/* Separators become navigational anchors, not chunky action cards. */
#tilesec { background: linear-gradient(180deg,color-mix(in srgb,var(--bg2) 92%,transparent),transparent 280px); }
#tiles { padding:0 7px 12px; gap:3px; }
.tile { position:relative; min-height:48px; padding:8px 9px 7px 12px; border:1px solid transparent; border-radius:9px;
  background:transparent; gap:1px 5px; transition:background .15s,border-color .15s; }
.tile:hover { background:var(--hover); border-color:var(--line-soft); }
.tile.cur { background:color-mix(in srgb,var(--accent) 10%,var(--panel)); border-color:color-mix(in srgb,var(--accent) 28%,var(--line-soft)); }
.tile.cur::before { content:""; width:2px; position:absolute; left:0; top:9px; bottom:9px; border-radius:4px; background:var(--accent); }
.tile .ctr { font-size:9px; line-height:1.2; color:var(--subtle); opacity:.78; }
.tile .on { font-size:9px; color:var(--ok); opacity:.92; }
.tile b { font-size:11.75px; font-weight:590; letter-spacing:0; }
/* The modlist is the primary work surface. */
.tools { flex:none; margin:0 11px 9px; padding:0; gap:5px; min-height:32px; }
.tools input { height:31px; font-size:11.5px; padding:5px 10px 5px 12px; }
.tools select { height:31px; font-size:11px; padding:5px 8px; min-width:0; }
.tools #badgeModel { max-width:180px; }
.tools #density { max-width:128px; }
.tools #err { font-size:10px; }
.tooth { flex:none; background:color-mix(in srgb, var(--surface2) 75%, transparent); padding:2px; gap:0; border-radius:9px;
   box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent); }
.tooth button { min-height:26px; padding:4px 9px; border-radius:7px; font-size:10.5px; font-weight:570; letter-spacing:.006em; }
.tooth button.on { background:var(--pop); color:var(--fg); box-shadow:0 1px 5px rgba(0,0,0,.13),inset 0 -2px var(--accent); }
#list { margin:0 11px 11px; border:1px solid var(--line); border-radius:12px;
  background:
    radial-gradient(ellipse 72% 54% at 36% 12%, rgba(44,86,139,.048),transparent),
    color-mix(in srgb,var(--panel) 94%,var(--bg));
  box-shadow:0 3px 24px rgba(0,0,0,.06), inset 0 1px rgba(255,255,255,.018);
}
:root[data-theme="light"] #list {background:var(--panel);}
#list:focus {border-color:var(--accent-border);outline:none;}
#layer { margin-inline:6px; }
/* Absolute positions and dimensions still belong exclusively to the Rust engine. */
#list.bricks .row:not(.sep) {
  border-color:color-mix(in srgb,var(--line) 70%, transparent);
  color:var(--fg);
  background:transparent;
  border-radius:0;
  overflow:visible;
  transition: background-color .12s ease, border-color .12s ease;
}
#list.bricks .row.mod:not(.sep):hover {background:color-mix(in srgb,var(--accent) 8%,transparent); border-color:var(--accent-border);z-index:3; --bb:color-mix(in srgb,var(--accent) 8%,var(--panel));}
#list.bricks .row.mod.sel:not(.sep) {--bb:color-mix(in srgb,var(--accent) 17%,var(--panel));background:color-mix(in srgb,var(--accent) 17%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
#list.bricks .row.mod.off:not(.sep) {background:color-mix(in srgb,var(--bg) 25%,transparent);--bb:color-mix(in srgb,var(--bg) 25%,var(--panel));}
#list.bricks .row .name { font-size:11.5px; font-weight:520; letter-spacing:.012em; }
/* the card's own text style (decor) wins over the bricks' default name style */
#list.bricks .row[style*="font-weight"] .name { font-weight: inherit; } #list.bricks .row[style*="font-size"] .name { font-size: inherit; }
#list.bricks .row.off .name {opacity:.75;}
#list.bricks .row > .lead { gap:4px; }
#list.bricks .row .toggle { width:9px; height:9px; margin:0; background:var(--miss);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
#list.bricks .row.on .toggle {background:var(--ok);box-shadow:0 0 0 1px rgba(83,214,164,.12),0 0 5px rgba(83,214,164,.17);}
#list.bricks .row .strip { gap:3px; }
#list.bricks .row .ctx { height:14px; padding:0 3px; gap:2px; background:hsl(var(--h) 37% 38%/.075); border-color:hsl(var(--h) 48% 57%/.28); }
#list.bricks .row .ctx>b { width:5px;height:5px;opacity:.84;box-shadow:none; }
#list.bricks .row .ico { width:12px;height:12px; flex-basis:12px; font-size:8px; filter:saturate(.75); border-color:hsl(var(--h) 55% 65%/.52); background:hsl(var(--h) 58% 46%/.18); }
#list.bricks .row .ctx:hover .ico {filter:saturate(1);}
#list.bricks .row .cnt {font:10px/1 var(--mono);gap:5px;opacity:.88; }
#list.bricks .row .stk i {font-size:8px; line-height:10px; }
#list.bricks .row.sep { background:transparent; color:var(--fg); border:0; border-bottom:1px solid var(--line); opacity:.96; padding-inline:11px; }
#list.bricks .row.sep > span:nth-child(2) { font-size:11.5px;letter-spacing:.006em; }
#list.bricks .row.sep .size {font-size:10px;color:var(--subtle);}
#list.bricks .row.focus::before,#list.bricks .row.focus::after { border-color:var(--accent2); width:9px; height:9px; z-index:4; filter:drop-shadow(0 0 2px rgba(121,178,255,.12)); }
/* Selection is not keyboard focus. Selected background is permanent until cleared. */
.row.sel {background:var(--accent-weak);}
/* Meta-info is a rack of tools; empty racks collapse visually. */
#summary { padding:8px 9px 14px; gap:5px; background:color-mix(in srgb, var(--bg2) 87%, transparent); }
#summary .block { border:1px solid color-mix(in srgb,var(--line) 73%,transparent);border-radius:10px;
  background:color-mix(in srgb,var(--panel) 90%,transparent);padding:9px 11px;box-shadow:none; }
#summary .block:hover {border-color:var(--line);}
#summary .block h3 {margin:0 0 7px;font:650 9px/1.4 var(--mono);letter-spacing:.12em;color:var(--muted);gap:7px;}
#summary .block h3::before {width:6px;height:6px; flex:none;box-shadow:none;opacity:.95;}
#summary .block.empty { padding:8px 11px; background:transparent; border-color:transparent; border-bottom-color:color-mix(in srgb,var(--line) 48%,transparent); border-radius:0; }
#summary .block.empty:hover { background:color-mix(in srgb,var(--panel) 76%, transparent);border-radius:8px;border-color:var(--line-soft); }
#summary .block.empty h3 {margin:0;color:var(--subtle);}
#summary .block.empty>.muted {display:none;}
#summary .block.ok h3::before {background:var(--signal);box-shadow:0 0 5px rgba(103,255,188,.16);}
#summary .block .muted {font-size:10.5px;line-height:1.48;}
#summary .block input,#summary .block select { min-height:25px;padding:4px 7px;font-size:11px; }
#summary .block input[type="checkbox"],#summary .block input[type="radio"] { min-height:0; }
#summary .block input[type="color"] { width:34px;max-width:34px; height:17px;max-height:17px; border-radius:4px; padding:1px; vertical-align:middle;}
#summary .dec-grid {gap:7px 8px;}
#summary .dec-grid label {font-size:10px;}
#summary .chains {padding:5px;margin-bottom:6px;background:var(--surface2);border-radius:9px;}
#summary .chn {border-radius:7px;font-size:11px;}

#rec,#fx,#ct,#sy { border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel); }
#rec .top,#sy .top,#ct .top,#fx .fxh {background:color-mix(in srgb,var(--bg2) 67%,var(--panel));}

#ct .tab,#fx .seg button {font-size:11px;}

:where(.te,.fhit,.fxlist .it,.fxcont .it):hover {background:var(--hover);}
::-webkit-scrollbar {width:6px;height:6px;}
::-webkit-scrollbar-thumb {background:var(--scroll-thumb);border-radius:12px;}
::-webkit-scrollbar-thumb:hover {background:var(--scroll-hot);}
/* Adaptive: three surfaces never overlap. Tiny screens reserve width for the canonical list. */
@media(max-width:1280px) {
  main {grid-template-columns:166px minmax(0,1fr) 288px;}
  .tools {gap:4px;}
  .tools #badgeModel {max-width:145px;}
  .tools #density {max-width:109px;}
}
@media(max-width:1100px) {
  main {grid-template-columns:minmax(0,1fr) 295px;}
  #tilesec {display:none;}
  body > header {gap:5px; padding-inline:10px;}
  .brand {margin-right:6px;}
  .pipeline {margin-right:0;padding-right:5px;}
}
@media(max-width:850px) {
  main {grid-template-columns:minmax(0,1fr) 250px;}
  .pipeline>span,.pipeline i {display:none;}
  .tools {flex-wrap:wrap; margin-bottom:7px;}
  .tools input#filter {min-width:120px;}
  .brand {letter-spacing:.06em;}
  body>header #recBtn {display:none;}
}
@media(max-width:700px) {
  main {grid-template-columns:minmax(0,1fr);}
  #summary {display:none;}
  body>header {min-height:47px;}
  .brand svg {width:24px;height:24px;}
  #stats {margin-left:auto;}
  .sandbox {display:none;}
}
/* Keep the one-column CSS grid from inheriting a large min-content width on narrow viewports. */
body { grid-template-columns:minmax(0,1fr); min-width:0; }
body > header, body > main { min-width:0; width:100%; }
main > section {min-width:0;}
@media(max-width:850px) {
  body>header .pipeline {gap:0;}

  #stats {gap:0;}
}

  body>header #fxBtn {font-size:0; padding:5px; width:28px; height:28px; justify-content:center;}
  body>header #fxBtn svg {width:16px;height:16px;}
  body>header #stats>span {font-size:0; padding:4px 4px;}
  body>header #stats>span b {font-size:10px;}
  body>header .brand {font-size:11px; margin-right:1px; gap:5px;}
  body>header .pipeline {padding-right:3px;}

}

<script>
"use strict";
const $ = id => document.getElementById(id);
const list = $("list"), layer = $("layer"), spacer = $("spacer");
const ROW = 44, GAP = 4, VIEW = 0, MAXPX = 8_000_000, CHAINS_SHOWN = 6;
let detailT = 0; // the mod card waits for the cursor to rest (`sync`)
// guides (ADR 0020 §2): no explanations in the interface — a faint «i» in the corner of a context opens its guide.
// Guides are data: [title, text]; the domain ones are filled from the core's own descriptions.
const GUIDES = {
  pass: ["Пробег", "Поверхность — подписи папок и сверка с проектом: новые, пропавшие, переименованные моды. Секунды; факты остаются прежними.\n\nПолный — скан (что не менялось — из кэша), факты, записи SYNC, источники, плагины, конфликты."],
  patch: ["Правка файла", "Файл мода не меняется. При фиксации исправленная копия уходит в мод «Satellite Patches» — он стоит в конце порядка и выигрывает.\n\nИзмени значение и нажми Enter. В песочнице правка живёт только в памяти окна."],
  advisor: ["Советник порядка", "Меньше оценка — раньше в списке (перекрывается). Имя: base / framework / core −22, patch / compat / fix +26, output / generated / nemesis / dyndolod +42; проигрывает втрое — −6, выигрывает втрое — +6.\n\nС текущим порядком: 0,45 · оценка + 0,55 · место. Моды двигаются только внутри своего разделителя; отмена — Ctrl+Z."],
  ct: ["Конфликты", ""],
  ctLegend: ["", ""],
  bricks: ["Список модов", "Порядок загрузки — сверху вниз, а в строке — слева направо; читается по индикаторам.\n\nСтрелки — прицел (выделение не меняется), Space — в выделение, Shift — расширить, Ctrl+стрелки — перейти и выделить. Alt + стрелки — двигать выделенное.\n\nУгол контейнера — тянуть размер, двойной клик — сброс. Удерживай Alt — палитра над модом. Наведи и подожди — облачко мода.\n\nПравый клик: заметка, сводка по тегу, превью закреплённого файла, лог-группа."],
  buffer: ["Буфер", "Отложенные моды для переноса: они остаются на местах, пока область не поставлена.\n\nБрось мод на «+» — новая область, на область — в неё (выделенный мод тянет всё выделение). Область — перетащи на мод в списке: встанет перед ним; «↧» — перед прицелом."],
};
const guideBtn = key => `<button class="inf" data-guide="${key}" type="button" title="Гайд">i</button>`;
function showGuide(key) {
  const g = GUIDES[key]; if (!g) return;
  let d = document.getElementById("guideDlg");
  if (!d) {
    d = document.createElement("dialog"); d.id = "guideDlg";
    d.innerHTML = `<header><strong></strong><button type="button" aria-label="Закрыть">×</button></header><div class="gt"></div>`;
    document.body.appendChild(d);
    d.querySelector("button").onclick = () => d.close();
    d.addEventListener("click", ev => { if (ev.target === d) d.close(); });
  }
  d.querySelector("strong").textContent = g[0];
  // a guide is text: markup from older notes becomes lines
  d.querySelector(".gt").textContent = g[1].replace(/<\/span>\s*<span>/g, "\n").replace(/<[^>]+>/g, "").trim();
  if (!d.open) d.showModal();
}
document.addEventListener("click", ev => { const b = ev.target.closest("[data-guide]"); if (b) { ev.stopPropagation(); ev.preventDefault(); showGuide(b.dataset.guide); } }, true);
let len = 0, total = 0, busy = false, again = false, fetched = { y0: 0, y1: -1 }, frame = 0, shownKey = null, detailSeq = 0, shownChains = [];
/** Cards on screen by entry key (ADR 0012: the page keeps what is visible; a card is rewritten only when it changed). */
const cards = new Map(), spare = [];
let badgeModel = "classic", density = 6, cols = 340;
try { badgeModel = localStorage.getItem("sat-badges") || "classic"; density = +(localStorage.getItem("sat-density") || 6);
  cols = +(localStorage.getItem("sat-cols2") ?? -1); } catch (_) {}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// the save state is asked after a command — not in a sandbox, where there is nothing to save
const sandboxed = () => { try { return !!PROJ && !PROJ.writable; } catch (_) { return false; } };
const command = c => post("/command", c).then(r => { if (!sandboxed()) projSoon(); return r; });
const query = q => post("/query", q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const num = n => n.toLocaleString("ru-RU");

function scale() { return total > MAXPX ? (total - list.clientHeight) / (MAXPX - list.clientHeight) : 1; }
function vtop() { return list.scrollTop * scale(); }
function flowWidth() { return Math.max(200, list.clientWidth - 12); }

/** Re-reads only the lines in the window (flow layout of ADR 0012); `follow` keeps the keyboard focus visible. */
async function sync(follow) {
  if (busy) { again = true; return; }
  busy = true;
  try {
    // overscan: a screen and a half above and two below, so scrolling moves cards already here (no wait)
    const h = list.clientHeight, vt0 = vtop(), y0 = Math.max(0, Math.floor(vt0 - h * 1.5));
    const rep = await query({ type: "lines", view: VIEW, y: y0, height: Math.ceil(h * 4.5), flow: flow(), badges: density, measures: cols < 0 ? brickMeasures().measures : null });
    fetched = { y0, y1: y0 + Math.ceil(h * 4.5) };
    len = rep.len; total = rep.total_height;
    spacer.style.height = Math.min(total, MAXPX) + "px";
    $("modcount").textContent = num(len) + " строк";
    if (follow && rep.focus) {
      const [top, fh] = rep.focus, vt = vtop();
      if (top < vt || top + fh > vt + h) {
        list.scrollTop = Math.max(0, top < vt ? top : top + fh - h) / scale();
        busy = false; return sync(false);
      }
    }
    const vt = vtop(), seen = new Set();
    let focused = null;
    for (const l of rep.lines) for (const c of l.cards) {
      // an element without an indicator shares its anchor's key: its card is named by both
      const r = c.row, ck = c.att ? `${r.key}:${c.att.attachment.id}` : r.key, el = cardEl(ck);
      seen.add(ck);
      r.index = c.index;
      el._lx = c.x; el._ly = l.y + (c.dy || 0);
      const b1 = cols < 0 && !l.header ? 1 : 0; // bricks: neighbours share one contour line
      const pos = [`translate(${c.x}px,${Math.round(el._ly - vt)}px)`, (c.width + b1) + "px", (l.header ? (cols < 0 ? BRICK_HEAD - 4 : ROW) : c.height + b1) + "px"];
      el._tall = cols < 0 && !l.header && c.height > BRICK;
      el._w = c.width + b1; el._h = c.height + b1;
      if (!el._pos || el._pos.join() !== pos.join()) { el._pos = pos; place(el); }
      if (c.att) { paintAtt(el, c.att, r); continue; }
      paint(el, r);
      if (r.focused) focused = r;
    }
    for (const [k, el] of cards) if (!seen.has(k)) { cards.delete(k); el.hidden = true; el._sig = ""; el._row = null; spare.push(el); }

  } catch (e) { $("err").textContent = e.message; }

}

    case "remove": return `проект: убрать ${esc(o.name)}`;
    case "to_deleted": return `диск: ${esc(o.name)} → satellite/deleted/<метка>/`;
    case "rename": return o.from !== undefined && o.to !== undefined && o.op === "rename" ? `переименовать ${esc(o.from)} → ${esc(o.to)}` : esc(JSON.stringify(o));
    case "create": return `диск: создать пустую папку ${esc(o.name)}`;
    case "patches": return `диск: записать ${esc(o.name)} (${o.patches.length} исправленных файлов)`;
    case "bake": return `диск: собрать ${esc(o.name)} из ${o.members.length} модов`;
    case "install": return `диск: установить ${esc(o.name)}`;
    default: return esc(JSON.stringify(o));
  }
}
async function syLoad() {
  const r = await query({ type: "sync" });
  const recs = r.records, p = r.plan, x = r.extras, pending = recs.filter(t => t.status === "pending").length;
  $("syncDot").textContent = pending ? String(pending) : "";
  $("syncBtn").classList.toggle("wait", pending > 0);
  if ($("sy").hidden) return;
  const last = PASS && PASS.last && !PASS.last.cancelled && !PASS.last.error ? PASS.last : null;
  $("syInfo").textContent = (last ? `по последнему пробегу (${last.mode === "full" ? "полный" : "поверхность"})` : "по пробегу при открытии окна") +
    ` · записей ${recs.length}, ждут ответа ${pending}` + (x ? "" : " · без сборки: план только по канону");
  const rows = recs.map(t => {
    const [ic, kind] = SY_KIND[t.mismatch.type] || ["?", t.mismatch.type], m = t.mismatch;
    const name = m.type === "fs_renamed" ? `<b>${esc(m.project_name)}</b> → <b>${esc(m.fs_name)}</b>` : `<b>${esc(m.fs_name || m.project_name)}</b>`;
    const st = t.status === "confirmed" ? `решено: ${SY_ANS[t.resolution] || t.resolution}` : t.status === "ignored" ? "игнор" : "ждёт ответа";
    const ans = t.answers.map(a => `<button data-fp="${esc(t.fingerprint)}" data-ans="${a}" class="${t.status === "confirmed" && t.resolution === a ? "on" : ""}">${SY_ANS[a] || a}</button>`).join("") +
      `<button data-fp="${esc(t.fingerprint)}" data-ans="ignore" class="${t.status === "ignored" ? "on" : ""}" title="запись остаётся, фиксация её не трогает">игнор</button>` +
      (t.status !== "pending" ? `<button data-fp="${esc(t.fingerprint)}" data-ans="pending">вернуть в ожидание</button>` : "");
    return `<div class="syr"><span class="ic">${ic}</span><span class="what">${name} <small>${kind} · ${t.entity === "separator" ? "разделитель" : "мод"}</small></span>` +
      `<span class="st ${t.status}">${st}</span><div class="ans">${ans}</div></div>`;
  }).join("") || `<div class="muted">расхождений нет: папка mods и проект сходятся</div>`;
  const ops = [...p.project_ops.map(o => o.op === "rename" ? `проект: переименовать ${esc(o.from)} → ${esc(o.to)}` : syOp(o)),
    ...p.disk_ops.map(o => o.op === "rename" ? `диск: переименовать папку ${esc(o.from)} → ${esc(o.to)}` : syOp(o))];
  if (x) {
    if (x.plugins_written || x.plugins_packed.length) ops.push(`plugins.txt / loadorder.txt: ${x.plugins_written ? "из проекта (его порядок, отметки, скрытые)" : "как есть"}${x.plugins_packed.length ? `, плюс ${esc(x.plugins_packed.join(", "))} включены в конце` : ""}`);
    for (const f of x.factories) ops.push(`фабрика: пересобрать ${esc(f)}`);
    for (const f of x.sealed) ops.push(`запечь и запечатать ${esc(f)}`);
    for (const [t, tool, out] of x.processors || []) ops.push(`после фиксации: процессор ${esc(t)} — MO2 запустит «${esc(tool)}», новое из Overwrite соберётся в ${esc(out)}`);
  }
  ops.push(`modlist.txt: из канона проекта (${num(p.canon_after.entries.length)} записей); закрывается записей ${p.settles.length}, в игноре ${p.ignored}`);
  const plan = `<div class="syp">${ops.map(o => `<span>${o}</span>`).join("")}` +
    (x ? x.notes.map(n => `<span class="nt">${esc(n)}</span>`).join("") : "") +
    (p.blockers.length ? p.blockers.map(b => `<span class="bl">⛔ ${syBlocker(b, recs)}</span>`).join("") : `<span style="color:var(--ok)">блокеров нет</span>`) + `</div>`;
  const { commit: cv } = await query({ type: "commit" });
  SY = { plan: p, commit: cv };
  const L = cv.last, CS = { committed: "зафиксировано", refused: "не начато", "rolled-back": "ошибка — всё откатено", incomplete: "ошибка — откат НЕ полный" };
  const res = cv.state === "running" || cv.state === "requested" ? `<div class="syc">фиксация идёт… окно перечитает сборку, когда она закончится</div>`
    : L ? `<div class="syc ${L.state === "committed" ? "ok" : "bad"}"><b>Последняя фиксация: ${CS[L.state] || L.state}</b>` +
      (L.state === "committed" ? `<span>шагов ${L.steps}; сборка перечитана, расхождений после: ${L.records_after ?? "?"}</span>` : "") +
      (L.processed || []).map(([id, n, ok, err]) => `<span class="${ok ? "" : "warn"}">процессор ${esc(id)}: ${ok ? `собрано файлов ${n}` : esc(err || "не продвинут")}</span>`).join("") +
      (L.error ? `<span>${esc(L.error)}</span>` : "") + (L.left.length ? `<span class="warn">не откатено: ${esc(L.left.join("; "))}</span>` : "") +
      (L.version_dir ? `<small>версия (бэкап, журнал): ${esc(L.version_dir)}</small>` : "") + `</div>` : "";
  $("syBody").innerHTML = res + `<div><h4>Расхождения</h4>${rows}</div><div><h4>План фиксации${x ? " — тот же, что выполнит sat-cli commit" : ""}</h4>${plan}</div>`;
  const onlyConfirm = p.blockers.length && p.blockers.every(b => b.blocker === "needs_confirmation");
  const can = cv.available && (!p.blockers.length || onlyConfirm) && cv.state !== "running" && cv.state !== "requested";
  $("syCommit").disabled = !can;
  $("syCommit").title = !cv.available ? "фиксация — только с --write (по умолчанию окно — песочница)" : can ? "записать план в сборку: бэкап, журнал, откат при ошибке" : "сначала убери блокеры";
  $("syFoot").textContent = !cv.available ? "песочница: зафиксировать — sat-cli commit … --apply или окно с --write"
    : p.blockers.length && !onlyConfirm ? "фиксация заблокирована, пока есть блокеры"
    : "перед записью окно сверит папку mods с записями; после — перечитает сборку";
}

// ---------------------------------------------------------------- patches of a mod's ini (`@sat:app.patches`)
let PE = null;
async function peOpen(mod, path) {
  PE = { mod, path };
  const { file: v } = await query({ type: "file-patch", mod_name: mod, path });
  if (!PE || PE.mod !== mod || PE.path !== path) return;
  const box = $("fxPrev");
  if (!v.found) { box.innerHTML = `<div class="muted">Файл не читается.</div>`; return; }
  let sec = null, rows = "";
  for (const k of v.keys) {
    if (k.section !== sec) { sec = k.section; rows += `<tr class="sec"><td colspan="4">${sec ? "[" + esc(sec) + "]" : "(до первой секции)"}</td></tr>`; }
    const cls = k.op === "set" ? "set" : k.op === "remove" ? "rm" : "";
    const now = k.op === "set" ? k.patched : k.op === "remove" ? "" : k.value;
    rows += `<tr class="${cls}" data-s="${esc(k.section)}" data-k="${esc(k.key)}"><td class="k">${esc(k.key)}</td><td class="v">${k.value == null ? "<i class=muted>нет в файле</i>" : esc(k.value)}</td>` +
      `<td>${k.op === "remove" ? "<i class=muted>удалён</i>" : `<input value="${esc(now ?? "")}" data-orig="${esc(now ?? "")}" aria-label="${esc(k.key)}">`}</td>` +
      `<td class="b">${k.op ? `<button data-pe="revert" title="вернуть значение мода">↺</button>` : ""}${k.op !== "remove" && k.value != null ? `<button data-pe="remove" title="убрать ключ из копии">✕</button>` : ""}</td></tr>`;
  }
  box.innerHTML = `<div class="pe"><h4><span>${esc(mod)} / ${esc(path)}</span><button data-pe="back">Готово</button>${v.patched ? `<button data-pe="drop" title="убрать всю правку этого файла">Убрать правку</button>` : ""}</h4>` +
    `<div class="note">${v.patched ? "правка есть" : "правки нет"} · в проекте ${v.total}${PROJ && PROJ.writable ? "" : " · песочница"} ${guideBtn("patch")}</div>` +
    (v.base_changed ? `<div class="warn">⚠ файл мода изменился после правки (мод обновили?) — фиксация остановится, пока не посмотришь <button data-pe="rebase">Принять текущий файл как основу</button></div>` : "") +
    `<table><tr><th>ключ</th><th>значение мода</th><th>в копии</th><th></th></tr>${rows}</table>` +
    `<div class="add"><input id="peS" placeholder="секция"><input id="peK" placeholder="ключ"><input id="peV" placeholder="значение"><button data-pe="add">Добавить</button></div>` +
    (v.text ? `<details><summary>Исправленная копия целиком</summary><pre class="txt">${v.text.split("\n").map((l, i) => `<span class="ln">${i + 1}</span>${hl("ini", l)}`).join("\n")}</pre></details>` : "") + `</div>`;
}
async function peEdit(edit) {
  try { await command({ type: "patch-file", mod_name: PE.mod, path: PE.path, edit }); } catch (e) { $("err").textContent = e.message; }
  await peOpen(PE.mod, PE.path);
  syLoad();
}
$("fxPrev").addEventListener("click", ev => {
  const b = ev.target.closest("[data-pe]"); if (!b || !PE) return;
  ev.stopPropagation();
  const tr = b.closest("tr"), key = tr ? { section: tr.dataset.s, key: tr.dataset.k } : null;
  switch (b.dataset.pe) {
    case "back": { const m = PE; PE = null; fxShow(m.path, FX.copy); return; }
    case "drop": return peEdit({ drop: true });
    case "rebase": return peEdit({ rebase: true });
    case "revert": return peEdit({ revert: [key] });
    case "remove": return peEdit({ remove: [key] });
    case "add": { const k = $("peK").value.trim(); if (!k) return; return peEdit({ set: [{ section: $("peS").value.trim(), key: k, value: $("peV").value.trim() }] }); }
  }
}, true);
$("fxPrev").addEventListener("keydown", ev => {
  const i = ev.target.closest(".pe input[data-orig]"); if (!i || ev.key !== "Enter") return;
  ev.preventDefault();
  const tr = i.closest("tr");
  if (i.value !== i.dataset.orig) peEdit({ set: [{ section: tr.dataset.s, key: tr.dataset.k, value: i.value }] });
});

let SY = null, syTimer = 0;
$("syCommit").onclick = async () => {
  if (!SY) return;
  const p = SY.plan, need = p.blockers.filter(b => b.blocker === "needs_confirmation");
  const n = p.project_ops.length + p.disk_ops.length;
  let text = `Зафиксировать план: ${n} операций, modlist.txt из проекта${need.length ? "" : ""}?\n\nПеред записью — версия-бэкап; при ошибке всё откатывается.`;
  if (need.length) text += "\n\nНеобратимо:\n" + need.map(b => "• " + b.what).join("\n");
  if (!confirm(text)) return;
  await command({ type: "commit", confirmed: need.map(b => b.confirm) });
  syWatch();
};
async function syWatch() {
  clearTimeout(syTimer);
  let cv;
  try { ({ commit: cv } = await query({ type: "commit" })); } catch (_) { syTimer = setTimeout(syWatch, 800); return; }
  if (cv.state === "running" || cv.state === "requested") { syLoad(); syTimer = setTimeout(syWatch, 500); return; }
  // committed: the server opened the build again — the page reads it anew and shows the result
  if (cv.state === "committed") { try { sessionStorage.setItem("sat-open-sync", "1"); } catch (_) {} location.reload(); return; }
  syLoad();
}
try { if (sessionStorage.getItem("sat-open-sync")) { sessionStorage.removeItem("sat-open-sync"); setTimeout(() => { $("sy").hidden = false; syLoad(); }, 300); } } catch (_) {}
$("syncBtn").onclick = () => { $("sy").hidden = !$("sy").hidden; if (!$("sy").hidden) syLoad(); };
$("syClose").onclick = () => { $("sy").hidden = true; list.focus({ preventScroll: true }); };
$("sySurface").onclick = async () => { await command({ type: "start-pass", mode: "surface" }); await passPoll(); };
$("syBody").onclick = async ev => {
  const b = ev.target.closest("[data-ans]"); if (!b) return;
  const a = b.dataset.ans, decision = a === "ignore" ? { decision: "ignore" } : a === "pending" ? { decision: "pending" } : { decision: "confirm", resolution: a };
  try { await command({ type: "decide", fingerprint: b.dataset.fp, decision }); } catch (e) { $("err").textContent = e.message; }
  syLoad();
};
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("sy").hidden) { ev.stopPropagation(); $("syClose").onclick(); } }, true);

// ---------------------------------------------------------------- saving the project (`@sat:app.project.state`)
let PROJ = null, projTimer = 0;
function projSoon() { clearTimeout(projTimer); projTimer = setTimeout(projPoll, 250); }
async function projPoll() {
  clearTimeout(projTimer);
  let st;
  try { ({ project: st } = await query({ type: "project" })); } catch (_) { return; }
  PROJ = st;
  const el = $("projState"), b = $("saveBtn");
  b.hidden = !st.writable;
  if (!st.writable) { el.textContent = "песочница"; el.title = "Песочница: изменения живут в памяти и никуда не пишутся"; el.className = "sandbox"; return; }
  el.className = "sandbox" + (st.error ? " bad" : st.dirty ? " dirty" : " ok");
  el.textContent = st.saving ? "сохраняется" : st.error ? (st.changed_outside ? "изменён вне окна" : "ошибка") : st.dirty ? "не сохранено" : "сохранено";
  el.title = st.path + (st.error ? (st.changed_outside ? "\nФайл проекта изменён вне окна — сохранение перезапишет его" : "\n" + st.error) : "");
  b.classList.toggle("dirty", st.dirty);
  b.querySelector("span").textContent = st.changed_outside ? "Перезаписать" : "Сохранить";
  if (st.saving) projTimer = setTimeout(projPoll, 300);
}
async function projSave() {
  if (!PROJ || !PROJ.writable) return;
  if (PROJ.changed_outside && !confirm("Файл проекта изменён другой программой после того, как окно его прочитало. Перезаписать?")) return;
  await post("/command", { type: "save-project", force: !!PROJ.changed_outside });
  await query({ type: "project" }); // the shell saves between requests
  projPoll();
}
$("saveBtn").onclick = projSave;
document.addEventListener("keydown", ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "s") { ev.preventDefault(); projSave(); } }, true);

(async () => { await sync(false); await Promise.all([totals(), tiles(), decor(), passPoll(), syLoad(), projPoll()]); list.focus({ preventScroll: true }); })();
</script>
<script id="sat-ui-dust-runtime">
(() => {
  const root = document.getElementById('sat-ui-dust');
  if (!root || root.childElementCount) return;
  let seed = 20261116;
  function rnd() { seed = (1664525 * seed + 1013904223) >>> 0; return seed / 4294967296; }
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 102; i++) {
    const dot = document.createElement('i');
    dot.style.cssText = `left:${(rnd()*100).toFixed(3)}%;top:${(rnd()*100).toFixed(3)}%;--r:${(.7+rnd()*1.1).toFixed(2)}px;--o:${(.065+rnd()*.17).toFixed(3)};--t:${(22+rnd()*37).toFixed(2)}s;--dx:${((rnd()-.5)*12).toFixed(2)}px;--dy:${((rnd()-.5)*15).toFixed(2)}px;animation-delay:${(-rnd()*36).toFixed(2)}s;`;
    fragment.appendChild(dot);
  }
  root.appendChild(fragment);
})();
</script>
<script id="sat-ui-guides-runtime">
(() => {
  const summary = document.querySelector('#summary');
  const help = {
    tilesec: ['Разделители', 'Якоря областей модлиста. Переход к разделителю не меняет канонический порядок.'],
  };
  const dlg = document.createElement('dialog');
  dlg.id = 'sat-design-guide';
  dlg.innerHTML = '<header><strong></strong><button type="button" aria-label="Закрыть">×</button></header><p></p>';
  document.body.appendChild(dlg);
  dlg.querySelector('button').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', event => { if (event.target === dlg) dlg.close(); });
  for (const [key, [title, details]] of Object.entries(help)) {
    const section = key === 'tilesec' ? document.getElementById('tilesec') : document.querySelector('main > section:nth-child(2)');
    const h = section?.querySelector('h2');
    if (!h || h.querySelector('.sat-guide-button')) continue;
    const btn = document.createElement('button');
    btn.className = 'sat-guide-button'; btn.type = 'button'; btn.textContent = 'i';
    btn.title = 'Открыть гайд';btn.setAttribute('aria-label',`Гайд: ${title}`);
    btn.addEventListener('click', () => {
      dlg.querySelector('strong').textContent = title;
      dlg.querySelector('p').textContent = details;
      if (!dlg.open) dlg.showModal();
    });
    h.appendChild(btn);
  }
  if (!summary) return;
  const collapsed = new Set();
  function syncToggles() {
    for (const box of summary.querySelectorAll('.block[id]:not(#bMod)')) {
      const h = box.querySelector('h3');
      if (!h) continue;
      box.classList.toggle('sat-collapsed',collapsed.has(box.id));
      if (h.querySelector('.sat-block-toggle')) continue;
      const button = document.createElement('button');
      button.type='button';button.className='sat-block-toggle';
      button.title='Свернуть или развернуть блок';
      button.setAttribute('aria-label',`Свернуть или развернуть: ${h.textContent.trim()}`);
      button.setAttribute('aria-expanded',String(!collapsed.has(box.id)));
      h.prepend(button);
    }
  }
  syncToggles();
  // Core rendering may refresh a block's heading; reapply only the tiny local button.
  let pending=false;
  new MutationObserver(() => {
    if(pending) return;
    pending=true;
    queueMicrotask(()=>{ pending=false; syncToggles(); });
  }).observe(summary,{childList:true,subtree:true});
  summary.addEventListener('click',event=>{
    const btn=event.target.closest('.sat-block-toggle');
    if(!btn) return;
    event.stopPropagation();event.preventDefault();
    const box=btn.closest('.block[id]'); if(!box)return;
    if(collapsed.has(box.id))collapsed.delete(box.id);else collapsed.add(box.id);
    box.classList.toggle('sat-collapsed',collapsed.has(box.id));
    btn.setAttribute('aria-expanded',String(!collapsed.has(box.id)));
  });
})();
</script>
