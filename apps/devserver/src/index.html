<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satellite NG</title>
<!-- Part of @sat:devserver: the main screen in the monolith's layout (docs/UI-PARITY.md §1): separator tiles,
     the mod list, the summary stack. It holds no truth: keys and clicks are commands, every change comes back as
     an event, the page re-reads only the rows it shows and repaints only rows whose content changed. -->
<style>
:root {
  /* monolith tokens (docs/UI-PARITY.md §3) */
  --bg: #10141b; --bg2: #161c25; --panel: #1b2230; --pop: #1f2733; --line: #344155; --fg: #e7edf7; --muted: #99a8bc;
  --primary: #2457a8; --primary-line: #2b69ca; --accent: #65a8ff; --accent2: #9ac6ff; --ok: #22c55e;
  --win: rgb(67, 142, 96); --lose: rgb(181, 82, 82); --miss: rgba(72, 84, 101, .94);
  --w-txt: #86efac; --l-txt: #fca5a5; --m-txt: #fcd34d; --x-txt: #c4b5fd;
  --black: #0b0d10; --red: #ef4444; --yellow: #f59e0b; --white: #94a3b8; --blue: #65a8ff; --green: #22c55e;
  --row: 44px; --ui: Inter, "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --bg2: #e6eaf0; --panel: #ffffff; --pop: #f6f8fb; --line: #d3d9e2; --fg: #1b2230; --muted: #5f6b7d;
  --w-txt: #1f7a45; --l-txt: #b42323; --m-txt: #a16207; --x-txt: #6d28d9; --black: #2b2f36; --white: #9aa3b2; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: linear-gradient(var(--bg), var(--bg2)); color: var(--fg); font: 14px/1.35 var(--ui); display: grid;
  grid-template-rows: auto 1fr auto; height: 100vh; }
button, input, select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
button { cursor: pointer; } button:hover { border-color: var(--primary-line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; }
.pill { font: 600 11px var(--ui); letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: var(--primary); color: #fff; }
.pipeline { display: flex; align-items: center; gap: 4px; }
.pipeline span { border: 1px solid var(--ok); border-radius: 10px; padding: 3px 10px; font-size: 13px; }
.pipeline i { color: var(--muted); font-style: normal; }
.sandbox { margin-left: auto; color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; min-height: 0; }
section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
section h2 { margin: 0; padding: 10px 12px 6px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
section h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
#tiles { overflow-y: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.tile { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px 10px; min-height: 64px; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; }
.tile:hover, .tile.cur { border-color: var(--primary-line); }
.tile .ctr { font: 11px var(--mono); color: var(--muted); }
.tile .on { font: 11px var(--mono); color: var(--ok); text-align: right; }
.tile b { grid-column: 1 / 3; align-self: end; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { display: flex; gap: 8px; padding: 0 10px 8px; align-items: center; }
.tools input { flex: 1; min-width: 0; }
#err { color: var(--l-txt); font-size: 12px; }
#list { flex: 1; overflow-y: auto; overflow-anchor: none; position: relative; outline: none; margin: 0 10px 10px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel); }
#list:focus { border-color: var(--primary-line); }
#spacer { width: 1px; }
#layer { position: sticky; top: 0; height: 0; }
.row { position: absolute; left: 0; right: 0; height: var(--row); border-bottom: 1px solid var(--line); cursor: default; user-select: none; }
.row.sel { background: color-mix(in srgb, var(--primary) 26%, transparent); }
/* mod card (owner's layout): toggle top-left, centred name cut on the right, counter group bottom-right */
.card { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: 22px 18px; height: 100%; padding: 2px 10px 2px 8px; }
.toggle { width: 11px; height: 11px; margin: 6px 0 0 2px; border-radius: 50%; background: var(--miss); cursor: pointer; }
.on .toggle { background: var(--ok); }
.name { grid-column: 2; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 2px; }
.off .name { color: var(--muted); }
.line2 { grid-row: 2; grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; min-width: 0; }
.counters { margin-left: auto; display: flex; gap: 10px; font: 11px var(--mono); color: var(--muted); flex: 0 0 auto; }
/* overwrite badges (monolith classic model): per context a pill with its colour dot and one icon per chain */
.strip { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.ctx { display: inline-flex; align-items: center; gap: 3px; height: 17px; padding: 0 4px 0 3px; border-radius: 999px; flex: 0 1 auto; min-width: 0; overflow: hidden;
  border: 1px solid hsl(var(--h) 60% 60% / .30); background: hsl(var(--h) 50% 40% / .12); }
.ctx > b { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: hsl(var(--h) 70% 60%); box-shadow: 0 0 6px hsl(var(--h) 70% 60% / .5); }
.ico { width: 15px; height: 15px; flex: 0 0 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; line-height: 1;
  background: hsl(var(--h) 55% 45% / .34); border: 1px solid hsl(var(--h) 60% 60% / .70); }
.ico.won { box-shadow: 0 0 0 1px var(--win); }
.ctx i { font: 10px var(--mono); font-style: normal; color: var(--muted); padding-left: 1px; }
.owpill { font: 11px var(--mono); padding: 0 6px; border-radius: 999px; border: 1px solid hsl(var(--h) 60% 60% / .35); background: hsl(var(--h) 50% 40% / .14); display: inline-flex; gap: 4px; align-items: center; }
.owpill b { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) 70% 60%); }
.counters .w { color: var(--w-txt); } .counters .l { color: var(--l-txt); } .counters .m { color: var(--m-txt); } .counters .x { color: var(--x-txt); font-weight: 600; }
.prio { color: var(--muted); }
.row.sep { height: var(--row); background: var(--bg2); font-weight: 600; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.row.sep .size { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.row.foreign .name { font-style: italic; color: var(--muted); }
.row[data-color="0"] { box-shadow: inset 4px 0 #ef4444; } .row[data-color="1"] { box-shadow: inset 4px 0 #22c55e; }
.row[data-color="2"] { box-shadow: inset 4px 0 #f59e0b; } .row[data-color="3"] { box-shadow: inset 4px 0 #a78bfa; }
.d1 .card { padding-left: 22px; }
/* keyboard focus: two opposite corners (monolith) */
.row.focus::before, .row.focus::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--accent); pointer-events: none; }
.row.focus::before { top: 2px; left: 2px; border-right: 0; border-bottom: 0; }
.row.focus::after { bottom: 2px; right: 2px; border-left: 0; border-top: 0; }
#summary { overflow-y: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 10px; border-right: 0; }
.block { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 8px 10px 10px; }
.block.ok { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.block h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.block h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.block.empty h3::before { background: var(--miss); }
.muted { color: var(--muted); font-size: 12px; }
.chain { border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; margin-bottom: 5px; background: var(--pop); cursor: pointer; }
.chain .t { display: flex; gap: 6px; align-items: baseline; }
.chain .t b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chain .t span { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.chain .stack { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chain .stack .me { color: var(--accent2); }
.chain .paths { font: 11px var(--mono); color: var(--muted); margin-top: 3px; display: none; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.chain.open .paths { display: block; }
.opp { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 6px; align-items: center; padding: 4px 6px; border-radius: 8px; cursor: pointer;
  border-bottom: 1px dashed color-mix(in srgb, #facc15 45%, transparent); }
.opp:hover { background: var(--pop); }
.opp .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); } .opp.off .dot { background: var(--miss); }
.opp .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp .nums { font: 11px var(--mono); } .opp .nums .w { color: var(--w-txt); } .opp .nums .l { color: var(--l-txt); }
.teeth { grid-column: 2 / 4; display: flex; gap: 1px; height: 6px; }
.teeth i { flex: 1; max-width: 10px; background: var(--miss); } .teeth i.w { background: var(--win); } .teeth i.l { background: var(--lose); }
.plug { display: grid; grid-template-columns: 56px 1fr; gap: 6px; font-size: 12px; padding: 2px 0; }
.plug .idx { font-family: var(--mono); color: var(--muted); }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
footer { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 14px; border-top: 1px solid var(--line); font: 12px var(--mono); color: var(--muted); }
footer b { color: var(--accent2); font-weight: 500; }
@media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr) 340px; } #tilesec { display: none; } }
</style>
</head>
<body>
<header>
  <span class="brand">Satellite</span><span class="pill">NG</span>
  <div class="pipeline" aria-label="Конвейер"><span>Анализ mods</span><i>→</i><span>Конфликты</span><i>→</i><span>Sync</span></div>
  <button id="theme" title="Светлая / тёмная">◐</button>
  <span class="sandbox">песочница: изменения живут в памяти и никуда не пишутся</span>
</header>
<main>
  <section id="tilesec"><h2>Разделители <small id="sepcount"></small></h2><div id="tiles"></div></section>
  <section>
    <h2>Моды <small id="modcount"></small></h2>
    <div class="tools"><input id="filter" type="search" placeholder="Фильтр по имени" aria-label="Фильтр по имени">
      <select id="badgeModel" aria-label="Модель бейджей"><option value="classic">Коллекция цепочек</option><option value="summary">OW N</option></select>
      <select id="density" aria-label="Плотность"><option value="3">Плотно · 3</option><option value="6">Обычно · 6</option><option value="12">Свободно · 12</option></select>
      <span id="err" role="status"></span></div>
    <div id="list" tabindex="0" aria-label="Список модов"><div id="layer"></div><div id="spacer"></div></div>
  </section>
  <section id="summary" aria-label="Сводка">
    <div class="block empty" id="bMod"><h3>Мод</h3><div class="muted">Наведи фокус на мод — стрелками или кликом.</div></div>
    <div class="block empty" id="bConf"><h3>Конфликты</h3></div>
    <div class="block empty" id="bPlug"><h3>Плагины</h3></div>
  </section>
</main>
<footer id="stats">загрузка…</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const list = $("list"), layer = $("layer"), spacer = $("spacer");
const ROW = 44, VIEW = 0, MAXPX = 8_000_000;
let len = 0, pool = [], busy = false, again = false, shownKey = null, detailSeq = 0;
let badgeModel = "classic", density = 6;
try { badgeModel = localStorage.getItem("sat-badges") || "classic"; density = +(localStorage.getItem("sat-density") || 6); } catch (_) {}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const command = c => post("/command", c);
const query = q => post("/query", q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const num = n => n.toLocaleString("ru-RU");

function scale() { const t = len * ROW; return t > MAXPX ? (t - list.clientHeight) / (MAXPX - list.clientHeight) : 1; }
function vtop() { return list.scrollTop * scale(); }
function ensurePool() {
  const need = Math.ceil(list.clientHeight / ROW) + 2;
  while (pool.length < need) { const el = document.createElement("div"); el.className = "row"; layer.appendChild(el); pool.push(el); }
}

/** Writes a row element only when what it shows changed. */
function paint(el, r) {
  const sig = r ? JSON.stringify(r) : "";
  if (el._sig === sig) return;
  el._sig = sig; el._row = r;
  if (!r) { el.hidden = true; return; }
  el.hidden = false;
  const cls = ["row"];
  if (r.selected) cls.push("sel");
  if (r.focused) cls.push("focus");
  if (r.color !== null) el.dataset.color = r.color % 4; else delete el.dataset.color;
  if (r.kind === "separator" || r.kind === "group") {
    cls.push("sep"); el.className = cls.join(" ");
    el.innerHTML = `<span>${r.collapsed ? "▸" : "▾"}</span><span>${esc(r.name.replace(/_separator$/, ""))}</span><span class="size">${r.size}</span>`;
    return;
  }
  cls.push(r.kind, `d${Math.min(r.depth, 1)}`, r.enabled ? "on" : "off");
  el.className = cls.join(" ");
  const c = r.counters;
  const counters = c ? [
    c.x ? `<span class="x" title="не виден в игре">X</span>` : "",
    c.plugins ? `<span title="плагинов">${c.plugins} esp</span>` : "",
    c.win ? `<span class="w" title="файлов выигрывает">W${c.win}</span>` : "",
    c.lose ? `<span class="l" title="файлов проигрывает">L${c.lose}</span>` : "",
    c.mid ? `<span class="m" title="в середине стека">M${c.mid}</span>` : "",
    c.unique ? `<span title="уникальных файлов">+${c.unique}</span>` : "",
  ].join("") : "";
  el.innerHTML = `<div class="card"><span class="toggle" title="вкл/выкл"></span><span class="name">${esc(r.name)}</span>` +
    `<div class="line2">${strip(r)}<div class="counters">${counters}<span class="prio" title="приоритет MO2">${r.pos}</span></div></div></div>`;
}

/** Overwrite badges of a card: "classic" = per context, one icon per chain; "summary" = one OW pill. */
function strip(r) {
  if (!r.badges || !r.badges.length) return "";
  if (badgeModel === "summary") {
    const files = r.badges.reduce((a, b) => a + b.files, 0), h = r.badges[0].hue;
    const n = r.badges.reduce((a, b) => a + b.chains.length + b.more, 0);
    return `<span class="owpill" style="--h:${h}" title="${files} конфликтных файлов · ${n} цепочек · ${r.badges.length} контекстов"><b></b>OW ${files}</span>`;
  }
  return `<span class="strip">` + r.badges.map(b => `<span class="ctx" style="--h:${b.hue}" title="контекст · ${b.files} файлов · ${b.chains.length + b.more} цепочек"><b></b>` +
    b.chains.map(c => `<span class="ico${c.place === 0 ? " won" : ""}" style="--h:${c.hue}" title="${esc(c.stack.join(" → "))} · ${c.files} ф. · ${c.place === 0 ? "выигрывает" : "проигрывает"}">${c.emoji}</span>`).join("") +
    (b.more ? `<i>+${b.more}</i>` : "") + `</span>`).join("") + `</span>`;
}

/** Re-reads only the rows in the window; `follow` keeps the keyboard focus visible. */
async function sync(follow) {
  if (busy) { again = true; return; }
  busy = true;
  try {
    ensurePool();
    const first = Math.floor(vtop() / ROW);
    const rep = await query({ type: "rows", view: VIEW, start: first, count: pool.length, badges: density });
    len = rep.len;
    spacer.style.height = Math.min(len * ROW, MAXPX) + "px";
    $("modcount").textContent = num(len) + " строк";
    if (follow && rep.focus_row !== null) {
      const top = rep.focus_row * ROW, vt = vtop(), h = list.clientHeight;
      if (top < vt || top + ROW > vt + h) {
        list.scrollTop = Math.max(0, top < vt ? top : top + ROW - h) / scale();
        busy = false; return sync(false);
      }
    }
    const off = -(vtop() - first * ROW);
    pool.forEach((el, i) => { el.style.transform = `translateY(${off + i * ROW}px)`; paint(el, rep.rows[i]); });
    const f = rep.rows.find(r => r.focused);
    if (f && f.kind === "mod" && f.key !== shownKey) detail(f.key);
  } catch (e) { $("err").textContent = e.message; }
  busy = false;
  if (again) { again = false; sync(false); }
}

async function totals() {
  const t = await query({ type: "totals" }), o = t.overwrite, p = t.plugins;
  $("stats").innerHTML = [
    `конфликтных путей <b>${num(o.conflict_paths)}</b>`, `цепочек <b>${num(o.chains)}</b>`, `контекстов <b>${o.contexts}</b>`,
    `X <b>${o.fully_overridden}</b>`, `плагинов <b>${p.active_full}</b> полных + <b>${p.active_light}</b> лёгких`,
    p.overflow_full + p.overflow_light ? `сверх лимита <b>${p.overflow_full}/${p.overflow_light}</b>` : "",
    `в нескольких модах <b>${p.versioned}</b>`, `без мастеров <b>${p.with_missing_masters}</b>`,
  ].filter(Boolean).map(s => `<span>${s}</span>`).join("");
}

async function tiles() {
  const { tiles } = await query({ type: "separators" });
  $("sepcount").textContent = tiles.length;
  $("tiles").innerHTML = tiles.map(t => `<div class="tile" data-key="${t.key}" title="${esc(t.name)}">` +
    `<span class="ctr">${t.index}:${t.first ?? "—"}:${t.mods}</span><span class="on">${t.enabled}●</span><b>${esc(t.name)}</b></div>`).join("");
}

/** The summary of the focused mod: with whom and in what it conflicts. */
async function detail(key) {
  shownKey = key;
  const seq = ++detailSeq;
  const { detail: d } = await query({ type: "mod-detail", key });
  if (seq !== detailSeq) return;
  const c = d.counters;
  $("bMod").className = "block ok";
  $("bMod").innerHTML = `<h3>Мод</h3><div><b>${esc(d.name)}</b></div>` + (c ? `<div class="muted">выигрывает <span style="color:var(--w-txt)">${num(c.win)}</span> ·
    проигрывает <span style="color:var(--l-txt)">${num(c.lose)}</span> · в середине ${num(c.mid)} · уникальных ${num(c.unique)}${c.x ? " · <b style='color:var(--x-txt)'>не виден в игре</b>" : ""}</div>` : "");
  const conf = $("bConf");
  if (!d.opponents.length) {
    conf.className = "block empty";
    conf.innerHTML = `<h3>Конфликты</h3><div class="muted">Ни с кем не конфликтует.</div>`;
  } else {
    conf.className = "block ok";
    const chains = d.chains.map(ch => `<div class="chain"><div class="t"><b>${esc(ch.title || "файлы")}</b><span>${num(ch.files)} ф.</span></div>` +
      `<div class="stack">${ch.stack.map((n, i) => i === ch.place ? `<span class="me">${esc(n)}</span>` : esc(n)).join(" ▸ ")}</div>` +
      `<div class="paths">${esc(ch.samples.join("\n"))}</div></div>`).join("");
    const opps = d.opponents.map(o => `<div class="opp${o.enabled ? "" : " off"}" data-key="${o.key ?? ""}" title="${o.key === null ? "Overwrite" : "перейти к моду"}">` +
      `<span class="dot"></span><span class="n">${esc(o.name)}</span>` +
      `<span class="nums">${o.i_beat ? `<span class="w">▲${num(o.i_beat)}</span> ` : ""}${o.beats_me ? `<span class="l">▼${num(o.beats_me)}</span>` : ""}</span>` +
      `<div class="teeth">${[...o.teeth].map(t => `<i class="${t === "-" ? "" : t}"></i>`).join("")}</div></div>`).join("");
    conf.innerHTML = `<h3>Конфликты</h3><div class="muted" style="margin-bottom:6px">${d.opponents.length} соперников · ${d.chains.length + d.more_chains} цепочек.
      ▲ — файлов, где этот мод перекрывает соперника, ▼ — где соперник перекрывает его. Зубы — по цепочкам ниже; клик по цепочке — пути.</div>
      ${opps}<div style="margin-top:10px">${chains}${d.more_chains ? `<div class="muted">и ещё ${d.more_chains} цепочек</div>` : ""}</div>`;
  }
  const pl = $("bPlug");
  pl.className = d.plugins.length ? "block ok" : "block empty";
  pl.innerHTML = `<h3>Плагины</h3>` + (d.plugins.length ? d.plugins.map(p => `<div class="plug"><span class="idx">${p.index ?? "—"}</span>` +
    `<span><span class="dotc" style="background:var(--${p.colour})"></span>${esc(p.name)}` +
    `${p.versions > 1 ? ` <span class="muted">· ${p.versions} версии, грузится из ${esc(p.owner ?? "")}</span>` : ""}` +
    `${p.missing_masters.length ? ` <span style="color:var(--l-txt)">· нет: ${esc(p.missing_masters.join(", "))}</span>` : ""}</span></div>`).join("")
    : `<div class="muted">Нет плагинов.</div>`);
}

async function run(c) {
  $("err").textContent = "";
  try {
    const ev = await command(c);
    if (ev.type === "changed") {
      await sync(true);
      if (ev.canon) { totals(); tiles(); if (shownKey !== null) detail(shownKey); }
    }
  } catch (e) { $("err").textContent = e.message; }
}

function chord(ev) {
  const named = { " ": "Space", ArrowUp: "ArrowUp", ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight",
    PageUp: "PageUp", PageDown: "PageDown", Home: "Home", End: "End", Enter: "Enter", Escape: "Escape" };
  const key = named[ev.key] || (ev.key.length === 1 ? ev.key.toUpperCase() : null);
  if (!key) return null;
  return (ev.ctrlKey || ev.metaKey ? "Ctrl+" : "") + (ev.altKey ? "Alt+" : "") + (ev.shiftKey ? "Shift+" : "") + key;
}
list.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); return run({ type: ev.shiftKey ? "redo" : "undo" }); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "y") { ev.preventDefault(); return run({ type: "redo" }); }
  const c = chord(ev);
  if (!c) return;
  ev.preventDefault();
  run({ type: "key", view: VIEW, chord: c });
});
list.addEventListener("click", ev => {
  const el = ev.target.closest(".row"); if (!el || !el._row) return;
  const r = el._row, row = Math.floor((vtop() + (el.getBoundingClientRect().top - list.getBoundingClientRect().top) + 1) / ROW);
  if (ev.target.classList.contains("toggle")) return run({ type: "set-enabled", keys: [r.key], enabled: null });
  if ((r.kind === "separator" || r.kind === "group") && ev.offsetX < 28) return run({ type: "set-collapsed", view: VIEW, separator: r.key, collapsed: !r.collapsed });
  const select = ev.shiftKey ? "extend" : (ev.ctrlKey || ev.metaKey) ? "toggle" : "replace";
  run({ type: "navigate", view: VIEW, nav: { row }, select });
});
list.addEventListener("scroll", () => sync(false), { passive: true });
window.addEventListener("resize", () => sync(false));
$("tiles").addEventListener("click", ev => {
  const t = ev.target.closest(".tile"); if (!t) return;
  document.querySelectorAll(".tile.cur").forEach(x => x.classList.remove("cur")); t.classList.add("cur");
  run({ type: "focus", view: VIEW, key: +t.dataset.key }).then(() => list.focus({ preventScroll: true }));
});
$("bConf").addEventListener("click", ev => {
  const o = ev.target.closest(".opp");
  if (o && o.dataset.key !== "") return run({ type: "focus", view: VIEW, key: +o.dataset.key }).then(() => list.focus({ preventScroll: true }));
  const ch = ev.target.closest(".chain"); if (ch) ch.classList.toggle("open");
});
let ft;
$("filter").addEventListener("input", ev => {
  clearTimeout(ft);
  ft = setTimeout(() => run({ type: "set-filter", view: VIEW, filter: { text: ev.target.value, enabled: null, color: null, show_muted: false } }), 150);
});
$("badgeModel").value = badgeModel; $("density").value = String(density);
const repaint = () => { pool.forEach(el => { el._sig = null; }); sync(false); };
$("badgeModel").onchange = ev => { badgeModel = ev.target.value; try { localStorage.setItem("sat-badges", badgeModel); } catch (_) {} repaint(); };
$("density").onchange = ev => { density = +ev.target.value; try { localStorage.setItem("sat-density", density); } catch (_) {} repaint(); };
$("theme").onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
  try { localStorage.setItem("sat-theme", r.dataset.theme); } catch (_) {}
};
try { const t = localStorage.getItem("sat-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

(async () => { await sync(false); await Promise.all([totals(), tiles()]); list.focus({ preventScroll: true }); })();
</script>
</body>
</html>
