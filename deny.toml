# ADR 0003: permissive licenses only in the client and core.
[licenses]
# bzip2-1.0.6 (BSD-style), CC0-1.0 / MIT-0 (public-domain-like): permissive, ADR 0003 — the 7z decoders (bzip2, PPMd)
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0", "Unlicense", "MPL-2.0", "ISC", "bzip2-1.0.6", "CC0-1.0", "MIT-0", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
